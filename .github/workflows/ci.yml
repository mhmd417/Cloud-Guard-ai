name: CloudGuard AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest for backend and ml
        env:
          PYTHONPATH: "."
          API_KEY: "ci-test-api-key"
          ALLOWED_ORIGIN: "http://localhost:5173"
        run: python -m pytest backend/tests ml/tests -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependencny-path: "web/package-lock.json"

      - name: Install web dependencies and build frontend
        working-directory: web
        env:
          VITE_API_URL: "http://127.0.0.1:8000"
          VITE_API_KEY: "ci-test-api-key"
        run: |
          npm ci
          npm run build
